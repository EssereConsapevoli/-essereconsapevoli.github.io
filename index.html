<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EssereConsapevoli - Ritrovati</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2b2b2b;
            --accent-color: #2e7d32;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            padding: 12px 20px;
            background-color: var(--bg-color);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn:hover {
            background-color: var(--accent-color);
            color: white;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>EssereConsapevoli</h1>
        <p>Applicazione mobile <strong>Ritrovati</strong></p>
        
        <div class="links">
            <a href="privacy.html" class="btn">Privacy Policy</a>
            <a href="assistenza.html" class="btn">Assistenza e Supporto</a>
            <a href="termini.html" class="btn">Termini e Condizioni</a>
        </div>
    </div>
</body>
</html>
